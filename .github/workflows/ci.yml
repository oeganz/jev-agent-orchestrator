name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fleet suite
        run: ls fleet/bin/*.test.mjs | grep -v reviewer-isolation | xargs node --test
      - name: Monitor suite
        run: node --test monitor/*.test.mjs
      - name: Reviewer-isolation control (live probe - needs an agent runtime)
        run: command -v claude >/dev/null 2>&1 && node fleet/bin/reviewer-isolation.test.mjs 1 || echo "claude not on PATH - live reviewer control skipped (it needs an interactive agent)"
      - name: Install check
        run: node fleet/bin/fleet.mjs doctor --fast
